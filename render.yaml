# Render blueprint: one web service serves the API and the owner console at /app/.
# Free tier: the disk is ephemeral, so the ledger is reseeded on each boot.
services:
  - type: web
    name: mandate
    runtime: node
    plan: free
    buildCommand: npm run setup && npm run build
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      # The API needs Node 22.13+ (node:sqlite). Pinned to the version it is tested on.
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /tmp/mandate.sqlite
      - key: API_KEY
        generateValue: true
      - key: PROPOSER_KEY
        generateValue: true
      - key: BUYER_AGENT_KEY
        generateValue: true
      # Ed25519 private key (PKCS8 PEM) that signs locks and deals. Generate once:
      #   node -e "console.log(require('crypto').generateKeyPairSync('ed25519').privateKey.export({type:'pkcs8',format:'pem'}))"
      # The free disk is wiped on restart, so keep this stable or old receipts stop verifying.
      - key: SIGNING_KEY
        sync: false
      # Turns the clerk, the negotiating agents, the client's reviewer and the rules drafter on (Ollama Cloud,
      # open-weights models). Everything else works without it.
      - key: OLLAMA_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Set these by hand in the dashboard after the first deploy (see docs/REFERENCE.md, Deployment):
      #   PAYPAL_WEBHOOK_ID    the id PayPal gives the webhook you register for https://<host>/v1/webhooks/paypal
      #   DEMO_RESET=on        lets the owner wipe the demo from System (refused unless PAYPAL_API is the sandbox)
      #   NOTIFY_WEBHOOK_URL   a Slack/Discord/Zapier https incoming webhook; it is a secret
      # Links to status pages and the console are built from RENDER_EXTERNAL_URL, which Render sets itself.
