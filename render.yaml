# Render blueprint: one web service serves the API and the owner console at /app/.
# Free tier: the disk is ephemeral, so the ledger is reseeded on each boot.
services:
  - type: web
    name: mandate
    runtime: node
    plan: free
    buildCommand: npm run setup && npm run build
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /tmp/mandate.sqlite
      - key: API_KEY
        generateValue: true
      - key: PROPOSER_KEY
        generateValue: true
      - key: BUYER_AGENT_KEY
        generateValue: true
      # Ed25519 private key (PKCS8 PEM) that signs locks and deals. Generate once:
      #   node -e "console.log(require('crypto').generateKeyPairSync('ed25519').privateKey.export({type:'pkcs8',format:'pem'}))"
      # The free disk is wiped on restart, so keep this stable or old receipts stop verifying.
      - key: SIGNING_KEY
        sync: false
      # Turns the clerk, the negotiating agents, the client's reviewer and the rules drafter on (Amazon Bedrock,
      # OpenAI-compatible endpoint). Everything else works without it.
      - key: BEDROCK_API_KEY
        sync: false
      - key: BEDROCK_REGION
        value: us-east-1
      - key: AGENT_MODEL
        value: us.openai.gpt-6-luna
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
