title = "Mandate"

[extend]
useDefault = true

# Fixed keys and mock data that only the test suite and the fake-PayPal dev server use. They protect nothing and are meant to be public.
# Anything else that looks like a secret fails the scan.
[allowlist]
description = "test fixtures"
paths = [
  '''web/src/lib/passkey-vector\.json''',
  '''api/test/ops-cleanup-scheduler\.test\.ts''',
  '''api/test/ops-readyz-secret\.test\.ts''',
]
regexes = [
  '''owner-e2e-key-0123456789''',
  '''proposer-e2e-key-0123456789''',
  '''buyer-agent-e2e-key-0123456789''',
  '''test-proposer-[A-Za-z0-9_-]+''',
  '''idemp-proposal-isolated-123''',
  '''SZYN5YgOjGh0NBcPZHZgW4_krrmihjLHmVzzuoMdl2MFAAAAAw''',
]
