# The gate. Every pull request and every push to main runs it; Render deploys a commit only after it passes
# (autoDeployTrigger: checksPass in render.yaml). Branch protection should require the single check "CI OK".
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless. main is never cancelled, so every commit on it gets a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hygiene:
    name: Repo rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # One Node version everywhere, pinned actions, no tracked secrets, a Render config that waits for CI.
      - run: node scripts/ci/hygiene.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Reads .gitleaks.toml. This repository is public, so a key committed here is a key published.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    name: API typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The red-team cases, the gate, the signed locks and the MCP door all run here, against a fake PayPal: no credentials.
      - run: npm test

  web:
    name: Console build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - run: npm run setup
      - run: npm run build
      - name: The console's API types match the API
        run: |
          npm --prefix web run gen:types
          git diff --exit-code -- web/src/lib/openapi.d.ts || {
            echo "::error file=web/src/lib/openapi.d.ts::The API changed but the console's types were not regenerated. Run: npm --prefix web run gen:types"
            exit 1
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: Browser tests (${{ matrix.project }})
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - run: npm run setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      # The suite drives the installed Google Chrome. GitHub's runners ship it; install it if that ever changes.
      - name: Chrome
        working-directory: web
        run: |
          command -v google-chrome >/dev/null 2>&1 || npx playwright install --with-deps chrome
          google-chrome --version
      - name: Playwright (${{ matrix.project }})
        working-directory: web
        run: npx playwright test --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.project }}
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # One name for branch protection to require. It fails if any job above failed or was cancelled.
  ci-ok:
    name: CI OK
    if: always()
    needs: [hygiene, secrets, api, web, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' >/dev/null; then
            echo "::error::A required job did not pass."
            exit 1
          fi
